<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

@if (!ui.presenting()) {
  <header class="topbar">
    <div class="topbar__inner">
      <a class="wordmark" routerLink="/dashboard" aria-label="A SOARES ADMIN, ir para o painel">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <rect x="3" y="4" width="18" height="4" rx="1.4" fill="currentColor" />
          <rect x="12" y="10" width="9" height="4" rx="1.4" fill="#e34948" />
          <rect x="3" y="16" width="8" height="4" rx="1.4" fill="#7fc3a6" />
        </svg>
        <span>A SOARES ADMIN</span>
      </a>

      <nav class="nav" aria-label="Principal">
        <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page">Painel</a>
        <a routerLink="/registrations" routerLinkActive="is-active" ariaCurrentWhenActive="page">Cadastro</a>
      </nav>

      <button
        type="button"
        class="icon-btn topbar__theme"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'"
        [title]="theme.theme() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <circle cx="10" cy="10" r="3.6" fill="currentColor" />
            <path
              d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1z" fill="currentColor" />
          </svg>
        }
      </button>
    </div>
  </header>
} @else {
  <button type="button" class="btn btn--sm exit-presentation" (click)="ui.stopPresentation()">
    Sair da apresentação (Esc)
  </button>
}

<main id="conteudo" tabindex="-1">
  <router-outlet />
</main>

<app-toast-outlet />
